version: "3.3"

services:
  artemis:
    image: apache/activemq-artemis:2.38.0
    container_name: artemis
    user: "artemis:artemis"
    ports:
      - "$port_artemis_broker:61616"
      - "$port_artemis_broker_ssl:61617"
      - "$port_artemis_broker_ssl_02:61618"
      - "$port_artemis_console:8161"
      - "$port_artemis_jmx_prometheus:9080"
    volumes:
      - ./artemis/etc/artemis.profile:/var/lib/artemis-instance/etc/artemis.profile
      - ./artemis/etc/bootstrap.xml:/var/lib/artemis-instance/etc/bootstrap.xml
      - ./artemis/etc/lib/:/var/lib/artemis-instance/etc/lib
      - ./artemis/etc/log4j2-utility.properties:/var/lib/artemis-instance/etc/log4j2-utility.properties
      - ./artemis/etc/login.config:/var/lib/artemis-instance/etc/login.config
      - ./artemis/etc/artemis-utility.profile:/var/lib/artemis-instance/etc/artemis-utility.profile
      - ./artemis/etc/broker.xml:/var/lib/artemis-instance/etc/broker.xml
      - ./artemis/etc/jolokia-access.xml:/var/lib/artemis-instance/etc/jolokia-access.xml
      - ./artemis/etc/log4j2.properties:/var/lib/artemis-instance/etc/log4j2.properties
      - ./artemis/etc/logging.properties:/var/lib/artemis-instance/etc/logging.properties
      - ./artemis/etc/management.xml:/var/lib/artemis-instance/etc/management.xml
      - ./artemis/monitoring/jmx_prometheus_config.yml:/var/lib/artemis-instance/lib/jmx_prometheus_config.yml
      - ./artemis/monitoring/jmx_prometheus_javaagent-0.17.2.jar:/var/lib/artemis-instance/lib/jmx_prometheus_javaagent.jar
      - ./artemis/monitoring/jboss-logmanager-2.1.19.Final.jar:/var/lib/artemis-instance/lib/jboss-logmanager-2.1.19.Final.jar
      - ./artemis/artemis:/var/lib/artemis-instance/bin/artemis
      - $docker_containers_shared_dir/conf/artemis/certificates:/var/lib/artemis-instance/etc/ssl
      - $docker_containers_shared_dir/conf/artemis/artemis-users.properties:/var/lib/artemis-instance/etc/artemis-users.properties
      - $docker_containers_shared_dir/conf/artemis/artemis-roles.properties:/var/lib/artemis-instance/etc/artemis-roles.properties
      - artemisData:/var/lib/artemis-instance/
      - /etc/localtime:/etc/localtime
    restart: unless-stopped
    
  openmrs-central:
    image: hub.csaude.org.mz/sesp/tomcat:9.0.97
    container_name: openmrs-central
    extra_hosts:
      - mysql-openmrs-central:$openmrs_db_host
      - mysql-dbsync-central:$dbsync_db_host
    depends_on:
      - artemis
    volumes:
      - ./openmrs-central/setenv.sh:/usr/local/tomcat/bin/setenv.sh
      - ./openmrs-central/scripts/:/usr/local/tomcat/scripts/
      - /etc/localtime:/etc/localtime
      - $docker_containers_shared_dir/conf/openmrs/central/openmrs-runtime.properties:/usr/local/tomcat/openmrs-runtime.properties
      - $docker_containers_shared_dir/conf/openmrs/central/openmrs.p12:/usr/local/tomcat/.OpenMRS/mpi/config/openmrs.p12
      - $docker_containers_shared_dir/openmrs/tomcat/webapps:/usr/local/tomcat/webapps/  
      - $docker_containers_shared_dir/openmrs/data:/usr/local/tomcat/.OpenMRS
      - $docker_containers_shared_dir/openmrs/data/hl7:/usr/local/tomcat/.OpenMRS/hl7
      - ./openmrs-central/modules/debezium-2.0.0.omod:/usr/local/tomcat/.OpenMRS/modules/debezium.omod
      - ./openmrs-central/modules/formdataexport-1.0.0.omod:/usr/local/tomcat/.OpenMRS/modules/formdataexport.omod
      - ./openmrs-central/modules/htmlformentry-6.0.0.omod:/usr/local/tomcat/.OpenMRS/modules/htmlformentry.omod
      - ./openmrs-central/modules/mpi-2.0.0.omod:/usr/local/tomcat/.OpenMRS/modules/mpi.omod      
      - ./openmrs-common/modules/calculation-1.3.0.omod:/usr/local/tomcat/.OpenMRS/modules/calculation.omod
      - ./openmrs-common/modules/eptsreports-4.3.0.omod:/usr/local/tomcat/.OpenMRS/modules/eptsreports.omod
      - ./openmrs-common/modules/clinicalsummary-1.0-RELEASE.omod:/usr/local/tomcat/.OpenMRS/modules/clinicalsummary.omod
      - ./openmrs-common/modules/htmlwidgets-1.11.0.omod:/usr/local/tomcat/.OpenMRS/modules/htmlwidgets.omod
      - ./openmrs-common/modules/legacyui-1.21.0.omod:/usr/local/tomcat/.OpenMRS/modules/legacyui.omod
      - ./openmrs-common/modules/owa-1.15.0.omod:/usr/local/tomcat/.OpenMRS/modules/owa.omod
      - ./openmrs-common/modules/reporting-1.25.0.omod:/usr/local/tomcat/.OpenMRS/modules/reporting.omod
      - ./openmrs-common/modules/serialization.xstream-0.2.16.omod:/usr/local/tomcat/.OpenMRS/modules/serialization.xstream.omod
      - ./openmrs-common/modules/webservices.rest-2.46.0.omod:/usr/local/tomcat/.OpenMRS/modules/webservices.rest.omod      
    working_dir: /usr/local/tomcat
    ports:
      - "$port_openmrs_central:8080"
      - "$port_openmrs_remote_debug:8000"
    entrypoint: [ "sh", "/usr/local/tomcat/scripts/run.sh" ]
    restart: unless-stopped

  dbsync-central:
    image: openjdk:17-alpine
    container_name: dbsync-central
    extra_hosts:
      - mysql-openmrs-central:$openmrs_db_host
      - mysql-dbsync-central:$dbsync_db_host
    env_file:
      - $docker_containers_shared_dir/conf/eip/dbsync.env   
    environment:
      - home_dir=/home/eip
      - shared_dir=/home/eip/shared
    depends_on:
      - openmrs-central
      - artemis
    ports:
      - "$port_dbsync_console:8081"
      - "$port_dbsync_remote_debug:8000"
    volumes:
      - $docker_containers_shared_dir/conf/eip/dbsync-users.properties:/home/eip/dbsync-users.properties
      - $docker_containers_shared_dir:/home/eip/shared
      - ./dbsync-central/run.prod.sh:/home/eip/run.sh
      - ./dbsync-central/init.prod.sh:/home/eip/init.sh
      - ./:/home/centralization-docker-setup/:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    working_dir: /home/eip
    entrypoint: [ "sh", "run.sh" ]
    restart: unless-stopped


volumes:
  artemisData:
    external: true
